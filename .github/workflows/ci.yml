name: CI

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # test_runner compiles against test/cbelt (a submodule), so unlike
          # release.yml this checkout must fetch submodules.
          submodules: recursive

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: strict
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils

      - name: Configure (CMake)
        shell: msys2 {0}
        # Plain, non-animated CBelt output so CI logs stay readable.
        run: cmake --preset ucrt64 -DBFWM_TEST_CI=ON

      - name: Build test_runner and BFWM
        shell: msys2 {0}
        run: cmake --build --preset ucrt64 --target test_runner BFWM

      - name: Run tests
        shell: msys2 {0}
        run: ./build/test/test_runner.exe
