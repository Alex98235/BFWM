name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The git tag is the single source of truth for the version. On a tag
      # build (v1.2.3) the leading "v" is stripped and exported as VERSION,
      # which the version resource and the installer filename both consume.
      # This workflow only ever produces user-facing releases, so a manual run
      # must supply the `version` input explicitly; there is no fallback.
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '${{ inputs.version }}'
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "No version available: push a 'v*' tag or supply the workflow_dispatch 'version' input."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building version $version"

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: strict
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils

      - name: Configure (CMake)
        shell: msys2 {0}
        run: cmake --preset ucrt64 -DBFWM_VERSION=$VERSION

      # Only the production target is built: the test target depends on the
      # test/cbelt submodule, which is not part of release builds.
      - name: Build BFWM
        shell: msys2 {0}
        run: cmake --build --preset ucrt64 --target BFWM

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Version $env:VERSION

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BFWM-Setup-${{ env.VERSION }}
          path: installer/output/BFWM-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BFWM ${{ env.VERSION }}
          files: installer/output/BFWM-Setup-*.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          draft: false
